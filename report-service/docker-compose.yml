version: "3.9"

services:
  report-db:
    image: postgres:16-alpine
    container_name: report-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: report_service
    ports:
      - "5435:5432"
    volumes:
      - report_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  report-service:
    build: .
    container_name: report-service
    depends_on:
      report-db:
        condition: service_healthy
    environment:
      PORT: 3005
      DB_HOST: report-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: report_service
      JWT_SECRET: ${JWT_SECRET:-change_me}
      ASSESSMENT_SERVICE_URL: ${ASSESSMENT_SERVICE_URL:-http://assessment-service:3002/api/v1}
      COMPETENCY_SERVICE_URL: ${COMPETENCY_SERVICE_URL:-http://competency-service:3003/api/v1}
      USER_GROUP_SERVICE_URL: ${USER_GROUP_SERVICE_URL:-http://user-group-service:3004/api/v1}
      REPORT_EXPIRY_DAYS: 30
    ports:
      - "3005:3005"
    restart: unless-stopped

volumes:
  report_db_data:
