openapi: 3.0.3
info:
  title: Report Service API
  description: |
    Microsserviço de Relatórios e Painel Administrativo — Grupo 5 (ES2 / PUCRS 2026-1).
    Responsável pela geração de relatórios individuais, por grupo, por competência e
    por avaliação, exportação em PDF/CSV/XLSX e painel administrativo consolidado.
  version: 1.0.0
  contact:
    name: Grupo 5 — Report Service
servers:
  - url: http://localhost:3005/api/v1
    description: Ambiente local (Ministack)

tags:
  - name: Reports
    description: Geração e consulta de relatórios
  - name: Exports
    description: Exportação de relatórios (PDF, CSV, XLSX)
  - name: Dashboard
    description: Painel administrativo consolidado (apenas ADMIN)
  - name: Health
    description: Health check

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Enums inline ────────────────────────────────────────────────────────
    ReportType:
      type: string
      enum: [INDIVIDUAL, GROUP, COMPETENCY, ASSESSMENT]
      description: |
        - INDIVIDUAL: resultados de um único usuário
        - GROUP: comparativo de desempenho entre membros de um grupo
        - COMPETENCY: distribuição de níveis de competências na plataforma
        - ASSESSMENT: taxa de conclusão e desempenho de uma avaliação

    ReportStatus:
      type: string
      enum: [PENDING, PROCESSING, READY, FAILED]

    ExportFormat:
      type: string
      enum: [PDF, CSV, XLSX]

    ExportStatus:
      type: string
      enum: [PENDING, PROCESSING, DONE, FAILED]

    # ── Filtros ─────────────────────────────────────────────────────────────
    ReportFilters:
      type: object
      properties:
        assessmentId:
          type: integer
          nullable: true
        userId:
          type: integer
          nullable: true
        groupId:
          type: integer
          nullable: true
        competencyId:
          type: integer
          nullable: true
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true

    # ── Entidades principais ─────────────────────────────────────────────────
    Report:
      type: object
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/ReportType'
        status:
          $ref: '#/components/schemas/ReportStatus'
        requestedByUserId:
          type: integer
        filters:
          $ref: '#/components/schemas/ReportFilters'
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true

    ReportWithData:
      allOf:
        - $ref: '#/components/schemas/Report'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              description: Dados consolidados do relatório (disponível quando status=READY)

    ExportJob:
      type: object
      properties:
        id:
          type: integer
        reportId:
          type: integer
        format:
          $ref: '#/components/schemas/ExportFormat'
        status:
          $ref: '#/components/schemas/ExportStatus'
        downloadUrl:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true

    # ── Paginação ────────────────────────────────────────────────────────────
    PaginatedReports:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ── Dashboard ────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        totalUsers:
          type: integer
        totalGroups:
          type: integer
        totalAssessments:
          type: integer
        totalCompetencies:
          type: integer
        completedAssessments:
          type: integer
        competencyDistributions:
          type: array
          items:
            type: object
            properties:
              competencyId:
                type: integer
              competencyName:
                type: string
              levelDistribution:
                type: array
                items:
                  type: object
                  properties:
                    levelId:
                      type: integer
                    count:
                      type: integer
        groupProgress:
          type: array
          items:
            type: object
            properties:
              groupId:
                type: integer
              groupName:
                type: string
              totalMembers:
                type: integer
                nullable: true
              assessmentsCompleted:
                type: integer

    TopPerformer:
      type: object
      properties:
        userId:
          type: integer
        levelId:
          type: integer
        levelName:
          type: string
          nullable: true

    CompletionRate:
      type: object
      properties:
        assessmentId:
          type: integer
        assessmentTitle:
          type: string
          nullable: true
        totalStarted:
          type: integer
        totalCompleted:
          type: integer
        completionRate:
          type: number
          format: float
          description: Percentual (0–100)

    # ── Progresso individual ─────────────────────────────────────────────────
    ProgressEntry:
      type: object
      properties:
        responseId:
          type: integer
        assessmentId:
          type: integer
        levelId:
          type: integer
        levelName:
          type: string
          nullable: true
        achievedAt:
          type: string
          format: date-time

    CompetencyProgress:
      type: object
      properties:
        userId:
          type: integer
        competencyId:
          type: integer
        competencyName:
          type: string
          nullable: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ProgressEntry'

    # ── Erros ────────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        message:
          type: string

security:
  - bearerAuth: []

paths:
  # ════════════════════════════════════════════════════════════════
  # Health
  # ════════════════════════════════════════════════════════════════
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Serviço saudável
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: report-service
                  timestamp:
                    type: string
                    format: date-time

  # ════════════════════════════════════════════════════════════════
  # Reports
  # ════════════════════════════════════════════════════════════════
  /reports:
    post:
      tags: [Reports]
      summary: Solicitar geração de relatório
      description: |
        Cria uma solicitação de relatório e inicia o processamento de forma assíncrona.
        Retorna HTTP 202 com o objeto criado (status=PENDING).
        Relatórios do tipo GROUP e ASSESSMENT são exclusivos para ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  $ref: '#/components/schemas/ReportType'
                filters:
                  $ref: '#/components/schemas/ReportFilters'
            examples:
              individual:
                summary: Relatório individual (próprio usuário)
                value:
                  type: INDIVIDUAL
                  filters:
                    dateFrom: "2025-01-01"
                    dateTo: "2025-12-31"
              group:
                summary: Relatório de grupo (ADMIN)
                value:
                  type: GROUP
                  filters:
                    groupId: 3
              competency:
                summary: Relatório de competência
                value:
                  type: COMPETENCY
                  filters:
                    competencyId: 1
              assessment:
                summary: Relatório de avaliação (ADMIN)
                value:
                  type: ASSESSMENT
                  filters:
                    assessmentId: 7
      responses:
        '202':
          description: Relatório criado e processamento iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sem permissão para este tipo de relatório
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Reports]
      summary: Listar todos os relatórios (ADMIN)
      description: Retorna todos os relatórios da plataforma com paginação. Exclusivo para ADMIN.
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ReportType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista paginada de relatórios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReports'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Acesso restrito a administradores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reports/my:
    get:
      tags: [Reports]
      summary: Listar meus relatórios individuais
      description: Retorna todos os relatórios INDIVIDUAL solicitados pelo usuário autenticado.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReportStatus'
      responses:
        '200':
          description: Lista de relatórios do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reports/my/progress:
    get:
      tags: [Reports]
      summary: Meu progresso de competências ao longo do tempo
      description: Retorna o histórico de níveis de competências do usuário autenticado, ordenado por data.
      parameters:
        - name: competencyId
          in: query
          schema:
            type: integer
          description: Filtrar por competência específica
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Progresso de competências
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetencyProgress'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reports/{id}:
    get:
      tags: [Reports]
      summary: Obter relatório por ID (com dados consolidados)
      description: Retorna o relatório incluindo os dados consolidados no snapshot (campo `data`). O usuário só pode acessar seus próprios relatórios, exceto ADMIN.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Relatório com dados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportWithData'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Relatório não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Reports]
      summary: Excluir relatório
      description: Remove o relatório e seu snapshot. O usuário só pode excluir seus próprios relatórios, exceto ADMIN.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Relatório excluído
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Relatório não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ════════════════════════════════════════════════════════════════
  # Exports
  # ════════════════════════════════════════════════════════════════
  /reports/{id}/exports:
    post:
      tags: [Exports]
      summary: Solicitar exportação de relatório
      description: |
        Cria um job de exportação para o relatório. O relatório precisa estar com status READY.
        O processamento é assíncrono — verifique o status em GET /exports/{jobId}.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format:
                  $ref: '#/components/schemas/ExportFormat'
            example:
              format: PDF
      responses:
        '202':
          description: Job de exportação criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '400':
          description: Formato inválido ou relatório não está READY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Relatório não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Relatório ainda não está pronto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Exports]
      summary: Listar exports de um relatório
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de jobs de exportação
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportJob'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Relatório não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /exports/{jobId}:
    get:
      tags: [Exports]
      summary: Consultar status/resultado de um export job
      description: Quando status=DONE, o campo `downloadUrl` estará preenchido com o link para download.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Export job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Export job não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ════════════════════════════════════════════════════════════════
  # Dashboard
  # ════════════════════════════════════════════════════════════════
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Visão consolidada da plataforma (ADMIN)
      description: Retorna totais de usuários, grupos, avaliações, competências e distribuição de níveis.
      responses:
        '200':
          description: Resumo do painel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Acesso restrito a administradores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dashboard/top-performers:
    get:
      tags: [Dashboard]
      summary: Top usuários por competência (ADMIN)
      parameters:
        - name: competencyId
          in: query
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista de top performers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopPerformer'
        '400':
          description: competencyId é obrigatório
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Acesso restrito a administradores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dashboard/completion-rates:
    get:
      tags: [Dashboard]
      summary: Taxas de conclusão por avaliação (ADMIN)
      responses:
        '200':
          description: Lista de taxas de conclusão
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompletionRate'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Acesso restrito a administradores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
