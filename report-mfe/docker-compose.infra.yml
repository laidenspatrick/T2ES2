# ============================================================================
# INTEGRAÇÃO DO REPORT SERVICE NO CHAVE-INFRA
# ============================================================================
#
# Cole o conteúdo abaixo dentro do docker-compose.yml do repositório
# chave-infra, na seção `services:`. Ajuste a variável JWT_SECRET para
# bater com o valor usado pelo MS Auth G7.
#
# Estrutura de diretórios esperada (tudo no mesmo pai):
#   /projeto
#     chave-infra/          ← docker-compose.yml principal
#     chave-shell/
#     chave-ms-auth-g7/
#     report-service/       ← este repositório (MS)
#     report-mfe/           ← este repositório (MFE)
#
# ============================================================================

version: "3.9"

services:

  # ── LocalStack (AWS emulado) ───────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,ses
      DEFAULT_REGION: us-east-1
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  # ── MS Auth G7 (eleito na T1) ─────────────────────────────────────────────
  ms-auth:
    build: ../chave-ms-auth-g7
    container_name: ms-auth
    environment:
      PORT: 3001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth_service
      JWT_SECRET: ${JWT_SECRET:-chave_turma_2026}
      JWT_EXPIRES_IN: 1h
    ports:
      - "3001:3001"
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Report Service (Grupo 5) ───────────────────────────────────────────────
  report-service:
    build: ../report-service
    container_name: report-service
    environment:
      PORT: 3005
      DB_HOST: report-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: report_service
      JWT_SECRET: ${JWT_SECRET:-chave_turma_2026}
      # URLs internas dos outros microsserviços na rede Docker
      ASSESSMENT_SERVICE_URL: http://assessment-service:3002/api/v1
      COMPETENCY_SERVICE_URL: http://competency-service:3003/api/v1
      USER_GROUP_SERVICE_URL: http://user-group-service:3004/api/v1
      REPORT_EXPIRY_DAYS: 30
    ports:
      - "3005:3005"
    depends_on:
      report-db:
        condition: service_healthy
      ms-auth:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  report-db:
    image: postgres:16-alpine
    container_name: report-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: report_service
    volumes:
      - report_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Report MFE (Grupo 5) ───────────────────────────────────────────────────
  report-mfe:
    build:
      context: ../report-mfe
      args:
        # Aponta para o backend na rede do host (browser faz a chamada)
        VITE_REPORT_SERVICE_URL: http://localhost:3005/api/v1
    container_name: report-mfe
    ports:
      - "3105:3105"
    depends_on:
      report-service:
        condition: service_healthy
    restart: unless-stopped

  # ── Shell App ──────────────────────────────────────────────────────────────
  chave-shell:
    build: ../chave-shell
    container_name: chave-shell
    environment:
      # URLs dos MFEs remotos (acessíveis pelo browser do usuário)
      VITE_REPORT_MFE_URL: http://localhost:3105/assets/remoteEntry.js
    ports:
      - "3000:3000"
    depends_on:
      - report-mfe
    restart: unless-stopped

volumes:
  localstack_data:
  auth_db_data:
  report_db_data:
